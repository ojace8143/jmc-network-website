# Build the site and publish it to the gh-pages branch.
#
# Classic gh-pages-branch pattern (peaceiris/actions-gh-pages):
# `main` is the source of truth; `gh-pages` is a pure build artifact
# that is never edited by hand.
#
# One-time setup after the first successful run:
#   Settings -> Pages -> Build and deployment -> Source:
#   "Deploy from a branch", branch `gh-pages`, directory `/ (root)`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # keep_files defaults to false: a main deploy replaces the whole
          # branch, which also clears any open PR preview subtrees.
          # Intentional — previews are throwaway.
